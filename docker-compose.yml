services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vimes_warehouse
      POSTGRES_USER: vimes
      POSTGRES_PASSWORD: vimes
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimes -d vimes_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vimes_postgres_data:/var/lib/postgresql/data

volumes:
  vimes_postgres_data:
